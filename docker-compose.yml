# Nebrix Panel – local/production compose file.
# All credentials come from .env (see .env.example). The database is not
# published to the host network.
services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: nebrix-panel:latest
    env_file: .env
    environment:
      DB_HOST: db
      LOG_PATH: php://stderr
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/nebrix/public/uploads
    restart: unless-stopped

  worker:
    image: nebrix-panel:latest
    env_file: .env
    environment:
      DB_HOST: db
      LOG_PATH: php://stderr
    command: ["php", "bin/nebrix", "queue:work"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: nebrix-panel:latest
    env_file: .env
    environment:
      DB_HOST: db
      LOG_PATH: php://stderr
    command: ["sh", "-c", "while true; do php bin/nebrix schedule:run; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  uploads:
