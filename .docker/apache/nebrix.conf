# Nebrix Panel virtual host. Only /public is exposed; the application code,
# configuration and storage live outside the document root.
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/nebrix/public

    <Directory /var/www/nebrix/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploaded branding files must never be executed.
    <Directory /var/www/nebrix/public/uploads>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php|phtml|phar|pl|py|cgi|sh|svg|html?)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "^/var/www/nebrix/(?!public)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
